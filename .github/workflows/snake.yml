name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # roda a cada 12h
  workflow_dispatch:         # permite rodar manualmente na aba Actions
  push:
    branches: [ main ]

permissions:
  contents: write            # ESSENCIAL: permissão de escrita no repo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Pirata2040
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          commit_message: "chore: regenerate snake animation"
